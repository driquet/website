<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<style>
.g1 { animation: d1 32s ease-in-out infinite alternate; }
.g2 { animation: d2 38s ease-in-out infinite alternate; }
@keyframes d1 { to { transform: translate(150px, -50px); } }
@keyframes d2 { to { transform: translate(-260px, 70px); } }
.drift { animation: drift 40s ease-in-out infinite alternate; }
.e { stroke: #7dd3fc; stroke-width: 1.1; animation: link 14s ease-in-out infinite; }
.m { stroke: #7dd3fc; stroke-width: .8; animation: mesh 14s ease-in-out infinite; }
.n { fill: #e0f2fe; animation: twinkle 10s ease-in-out infinite; }
.f { fill: #bae6fd; animation: twinkle-f 10s ease-in-out infinite; }
@keyframes drift { to { transform: translate(-30px, 25px); } }
@keyframes link { 0%,100% { stroke-opacity: .22; } 50% { stroke-opacity: .45; } }
@keyframes mesh { 0%,100% { stroke-opacity: .02; } 50% { stroke-opacity: .14; } }
@keyframes twinkle { 0%,100% { opacity: .6; } 50% { opacity: 1; } }
@keyframes twinkle-f { 0%,100% { opacity: .3; } 50% { opacity: .75; } }
.a1 { animation: a1 16s ease-in-out infinite alternate; transform-origin: 800px 900px; }
.a2 { animation: a2 21s ease-in-out infinite alternate; transform-origin: 800px 900px; }
.a3 { animation: a3 14s ease-in-out infinite alternate; transform-origin: 800px 900px; }
@keyframes a1 { 0% { transform: translateX(-220px) scaleY(.6); opacity: .35; } 100% { transform: translateX(200px) scaleY(1.7); opacity: .9; } }
@keyframes a2 { 0% { transform: translateX(240px) scaleY(1.6); opacity: .75; } 100% { transform: translateX(-260px) scaleY(.6); opacity: .25; } }
@keyframes a3 { 0% { transform: translateX(-120px) scaleY(.7); opacity: .15; } 100% { transform: translateX(160px) scaleY(1.9); opacity: .55; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<radialGradient id="gc"><stop offset="0" stop-color="#06b6d4" stop-opacity=".4"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
<radialGradient id="gb"><stop offset="0" stop-color="#3b82f6" stop-opacity=".45"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
<linearGradient id="rib" x1="0" x2="1"><stop stop-color="#06b6d4"/><stop offset=".5" stop-color="#3b82f6"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
<filter id="soft" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="45"/></filter>
